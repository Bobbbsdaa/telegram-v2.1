<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0b1a">
<title>ZadrottzGram</title>
<script>document.documentElement.dataset.theme = localStorage.zg_theme || 'dark';</script>
<style>
:root{
  --fg:#fff; --fg2:rgba(255,255,255,.62); --edge:rgba(255,255,255,.2);
  --g1:rgba(255,255,255,.16); --g2:rgba(255,255,255,.05);
  --panel:linear-gradient(140deg,rgba(46,48,92,.78),rgba(22,22,48,.82));
  --bub-in:rgba(30,32,62,.62); --field:rgba(255,255,255,.1);
  --acc1:#7c5cff; --acc2:#00d1ff; --danger:#ff5d73; --ok:#3ddc97;
  --shadow:rgba(0,0,0,.35); --wallbg:#0b0b1a;
  --ease:cubic-bezier(.2,.9,.25,1); --spring:cubic-bezier(.3,1.4,.5,1);
}
[data-theme=light]{
  --fg:#14151f; --fg2:rgba(20,21,31,.58); --edge:rgba(255,255,255,.85);
  --g1:rgba(255,255,255,.72); --g2:rgba(255,255,255,.38);
  --panel:linear-gradient(140deg,rgba(255,255,255,.9),rgba(240,243,255,.9));
  --bub-in:rgba(255,255,255,.82); --field:rgba(20,21,31,.07);
  --shadow:rgba(50,60,110,.22); --wallbg:#dfe6ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--wallbg);color:var(--fg);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
[hidden]{display:none!important}
.ico{display:inline-flex;vertical-align:middle}.fill svg{fill:currentColor}

/* ---------- обои ---------- */
#wall{position:fixed;inset:0;overflow:hidden;z-index:0}
.blob{position:absolute;border-radius:50%;will-change:transform;opacity:.85}
.b1{width:70vmax;height:70vmax;left:-20vmax;top:-25vmax;background:radial-gradient(circle,#7c5cff 0,transparent 65%);animation:drift1 22s ease-in-out infinite alternate}
.b2{width:60vmax;height:60vmax;right:-20vmax;top:10vmax;background:radial-gradient(circle,#00c2ff 0,transparent 65%);animation:drift2 26s ease-in-out infinite alternate}
.b3{width:65vmax;height:65vmax;left:5vmax;bottom:-30vmax;background:radial-gradient(circle,#ff4fa3 0,transparent 65%);animation:drift3 30s ease-in-out infinite alternate}
[data-theme=light] .blob{opacity:.6}
body:not([data-wall=live]) .blob{display:none}
#wallImg,#wallDim{position:absolute;inset:0;background-size:cover;background-position:center}
#wallDim{background:#000;opacity:0;transition:opacity .3s}
@keyframes drift1{to{transform:translate(18vmax,14vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-16vmax,18vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(20vmax,-12vmax) scale(1.2)}}

/* ---------- жидкое стекло ---------- */
.glass{position:relative;isolation:isolate;background:linear-gradient(135deg,var(--g1),var(--g2));
  -webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.06),0 10px 34px var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:1;
  background:linear-gradient(135deg,rgba(255,255,255,.65),rgba(255,255,255,.06) 38%,rgba(255,255,255,.06) 62%,rgba(255,255,255,.4));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--panel)}}

.btn{position:relative;height:46px;padding:0 22px;border-radius:99px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .25s var(--spring),filter .2s,opacity .2s;background:var(--field);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.btn:active{transform:scale(.95)}.btn[disabled]{opacity:.45;pointer-events:none}
.btn.primary{color:#fff;background:linear-gradient(135deg,var(--acc1),var(--acc2));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 6px rgba(0,0,0,.12),0 8px 22px color-mix(in srgb,var(--acc1) 45%,transparent)}
.btn.danger{color:var(--danger)}
.icon-btn{width:42px;height:42px;border-radius:50%;display:inline-grid;place-items:center;flex:none;transition:transform .25s var(--spring),background .2s}
.icon-btn:active{transform:scale(.88)}
.icon-btn:hover{background:var(--field)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

.field{display:flex;align-items:center;gap:6px;height:48px;padding:0 16px;border-radius:16px;background:var(--field);border:1px solid transparent;transition:border-color .2s,background .2s}
.field:focus-within{border-color:var(--acc1);background:color-mix(in srgb,var(--field) 60%,transparent)}
.field input{flex:1;min-width:0;background:none;border:0;outline:0}
.field input::placeholder,textarea::placeholder{color:var(--fg2)}
.field>span{color:var(--fg2)}
.err{color:var(--danger);min-height:18px;font-size:13px;text-align:center}

.seg{--n:2;position:relative;display:flex;padding:4px;border-radius:99px;background:var(--field)}
.seg button{position:relative;z-index:1;flex:1;height:36px;border-radius:99px;font-weight:600;color:var(--fg2);transition:color .25s}
.seg button.on{color:var(--fg)}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n));border-radius:99px;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 14px var(--shadow);background-color:rgba(255,255,255,.14);transition:transform .4s var(--spring)}

/* ---------- экраны ---------- */
.screen{position:fixed;inset:0;z-index:1}
#auth{display:grid;place-items:center;padding:20px;overflow:auto}
.auth-card{width:min(400px,100%);padding:30px 26px;border-radius:32px;display:flex;flex-direction:column;gap:14px;animation:rise .7s var(--ease) both}
.logo{width:72px;height:72px;margin:0 auto;border-radius:24px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--acc1),var(--acc2));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 12px 30px color-mix(in srgb,var(--acc1) 50%,transparent);animation:float 5s ease-in-out infinite}
.auth-card h1{margin:0;text-align:center;font-size:26px;letter-spacing:-.02em}
.sub{margin:-8px 0 4px;text-align:center;color:var(--fg2)}
#userMode,#phoneMode{display:flex;flex-direction:column;gap:14px}
.reg-only{display:none}.reg .reg-only{display:flex}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}}
@keyframes float{50%{transform:translateY(-6px)}}

#main{display:flex;gap:12px;padding:12px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}
#side{width:370px;flex:none;border-radius:30px;display:flex;flex-direction:column;overflow:hidden;transition:transform .45s var(--ease),opacity .45s}
.side-top{display:flex;align-items:center;gap:10px;padding:14px 14px 6px}
.brand{flex:1;font-weight:700;font-size:18px;letter-spacing:-.02em}
.chip{height:36px;padding:0 12px;border-radius:99px;display:inline-flex;align-items:center;gap:6px;font-weight:700;background:var(--field);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);transition:transform .25s var(--spring)}
.chip:active{transform:scale(.93)}.chip .star{color:#ffc93c}
.search{display:flex;align-items:center;gap:8px;margin:8px 14px 10px;height:42px;padding:0 14px;border-radius:99px;background:var(--field);color:var(--fg2)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg)}
#list{flex:1;overflow-y:auto;padding:0 8px 10px;overscroll-behavior:contain}
.item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:20px;cursor:pointer;transition:background .2s,transform .25s var(--spring)}
.item.anim{animation:fadeUp .4s var(--ease) both}
.item:hover{background:var(--field)}.item:active{transform:scale(.98)}
.item.sel{background:var(--field);background:linear-gradient(135deg,color-mix(in srgb,var(--acc1) 40%,transparent),color-mix(in srgb,var(--acc2) 30%,transparent))}
.item .mid{flex:1;min-width:0}
.item .nm{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .pv{color:var(--fg2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .pv.typing{color:var(--acc2)}
.item .rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:12px;color:var(--fg2)}
.badge{min-width:22px;height:22px;padding:0 7px;border-radius:99px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;background:linear-gradient(135deg,var(--acc1),var(--acc2));animation:pop .35s var(--spring)}
.hint{padding:40px 24px;text-align:center;color:var(--fg2)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}}

.av{position:relative;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;overflow:visible;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.av img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover}
.av .dot{position:absolute;right:-1px;bottom:-1px;width:28%;height:28%;min-width:10px;min-height:10px;border-radius:50%;background:var(--ok);border:2px solid #1b1b3a;animation:pop .3s var(--spring)}

#chat{flex:1;min-width:0;position:relative;border-radius:30px;overflow:hidden;transition:transform .45s var(--ease)}
.empty{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;color:var(--fg2);padding:20px}
.empty .logo{opacity:.9}
.chat-in{position:absolute;inset:0}
.chat-head{position:absolute;z-index:5;left:10px;right:10px;top:10px;height:60px;border-radius:26px;display:flex;align-items:center;gap:6px;padding:0 8px}
.chat-head .who{flex:1;min-width:0;display:flex;align-items:center;gap:10px;cursor:pointer;padding:4px;border-radius:16px}
.chat-head .t1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .t2{font-size:12.5px;color:var(--fg2);height:16px;overflow:hidden}
.chat-head .t2.on{color:var(--acc2)}
.dots i{display:inline-block;width:4px;height:4px;margin-left:2px;border-radius:50%;background:currentColor;animation:bounce 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{40%{transform:translateY(-4px)}}
.back{display:none}

#msgs{position:absolute;inset:0;overflow-y:auto;padding:84px 14px 92px;display:flex;flex-direction:column;gap:3px;overscroll-behavior:contain;scroll-behavior:auto}
.day{align-self:center;margin:10px 0 6px;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bub-in);color:var(--fg2)}
.row{display:flex}.row.mine{justify-content:flex-end}
.row.new{animation:msgIn .42s var(--spring) both}.row.new.mine{transform-origin:100% 100%}.row.new.theirs{transform-origin:0 100%}
@keyframes msgIn{from{opacity:0;transform:translateY(14px) scale(.85)}}
.bub{position:relative;max-width:min(80%,520px);padding:8px 12px 6px;border-radius:20px;word-break:break-word;white-space:pre-wrap;background:var(--bub-in);box-shadow:inset 0 1px 0 rgba(255,255,255,.22);border:1px solid var(--edge)}
.theirs .bub{border-bottom-left-radius:6px}
.mine .bub{border-bottom-right-radius:6px;color:#fff;border-color:rgba(255,255,255,.25);background:linear-gradient(135deg,var(--acc1),var(--acc2));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 16px color-mix(in srgb,var(--acc1) 35%,transparent)}
.bub a{color:inherit;text-decoration:underline}
.meta{float:right;margin:7px 0 -3px 10px;display:inline-flex;align-items:center;gap:3px;font-size:11px;opacity:.65;white-space:nowrap}
.tick{display:inline-flex}.tick.st2{color:#7dffb4;opacity:1}
.big{font-size:52px;line-height:1.1;background:none!important;border:0!important;box-shadow:none!important;padding:0 4px}
.big .meta{display:none}
.bub.media{padding:4px}.bub.media img{display:block;max-width:100%;max-height:340px;border-radius:16px;cursor:zoom-in}
.bub.media .meta{position:absolute;right:10px;bottom:8px;margin:0;padding:2px 8px;border-radius:99px;background:rgba(0,0,0,.45);color:#fff;opacity:1}
.bub.gift{padding:10px;text-align:center;cursor:pointer}
.bub.gift .cap{margin:8px 2px 2px;font-size:13px;opacity:.9}.bub.gift .note{font-size:13.5px;margin-top:2px}
.bub.gift .meta{float:none;justify-content:flex-end;margin:4px 0 0}
.bub.stars{display:flex;align-items:center;gap:10px;padding:12px 16px}
.bub.stars .big-star{font-size:30px;filter:drop-shadow(0 0 10px #ffc93c);animation:float 3s ease-in-out infinite}
.bub.stars b{font-size:19px}.bub.stars small{display:block;opacity:.75}
.bub.file{display:flex;align-items:center;gap:10px;min-width:200px}
.fic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.2);flex:none}
.bub.file .fn{font-weight:600;word-break:break-all}.bub.file small{opacity:.7;display:block}
.bub.voice{display:flex;align-items:center;gap:10px;min-width:230px}
.vbtn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;flex:none;transition:transform .2s var(--spring)}
.vbtn:active{transform:scale(.88)}
.wave{flex:1;height:30px;display:flex;align-items:center;gap:2px;cursor:pointer}
.wave i{flex:1;min-width:2px;border-radius:2px;background:currentColor;opacity:.35;transition:opacity .15s}.wave i.on{opacity:1}
.vt{font-size:12px;opacity:.8;min-width:34px;text-align:right}
.bub.voice .meta{position:absolute;right:12px;bottom:3px;margin:0}

.composer{position:absolute;z-index:5;left:10px;right:10px;bottom:10px;border-radius:28px;padding:6px;display:flex;align-items:flex-end;gap:2px}
.composer textarea{flex:1;min-width:0;resize:none;border:0;outline:0;background:none;max-height:130px;padding:11px 6px;line-height:1.3}
.sendwrap{position:relative;width:42px;height:42px;flex:none}
.sendbtn{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--acc1),var(--acc2));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 16px color-mix(in srgb,var(--acc1) 40%,transparent);transition:transform .25s var(--spring)}
.sendbtn:active{transform:scale(.88)}
.sendbtn .ico{position:absolute;transition:transform .35s var(--spring),opacity .2s}
.sendbtn .i-send{transform:scale(.3) rotate(-60deg);opacity:0}
.has-text .sendbtn .i-send{transform:none;opacity:1}.has-text .sendbtn .i-mic{transform:scale(.3) rotate(60deg);opacity:0}
.rec-ui{display:none;flex:1;align-items:center;gap:10px;padding:0 8px;height:42px}
.recording .rec-ui{display:flex}.recording textarea,.recording .hide-rec{display:none}
.rec-dot{width:12px;height:12px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.5);opacity:.4}}
.recording .sendbtn .i-send{transform:none;opacity:1}.recording .sendbtn .i-mic{opacity:0}
.emoji{position:absolute;z-index:6;left:14px;bottom:80px;width:min(300px,calc(100% - 28px));padding:10px;border-radius:24px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;transform-origin:0 100%;animation:msgIn .3s var(--spring) both}
.emoji button{font-size:22px;height:34px;border-radius:10px}.emoji button:hover{background:var(--field)}

/* ---------- NFT ---------- */
.nft{--w:180px;position:relative;width:var(--w);aspect-ratio:3/4;border-radius:calc(var(--w)*.12);overflow:hidden;color:#fff;background:linear-gradient(160deg,var(--c1),var(--c2));isolation:isolate;flex:none;text-align:left;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 10px 26px rgba(0,0,0,.35)}
.nft-pat span{position:absolute;opacity:.2;font-size:calc(var(--w)*.09);transform:translate(-50%,-50%)}
.nft-emoji{position:absolute;left:0;right:0;top:15%;text-align:center;font-size:calc(var(--w)*.46);line-height:1.15;animation:float 4.5s ease-in-out infinite;filter:drop-shadow(0 8px 12px rgba(0,0,0,.35))}
.nft-foot{position:absolute;left:0;right:0;bottom:0;padding:14% 8% 7%;background:linear-gradient(transparent,rgba(0,0,0,.5));display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:calc(var(--w)*.075);font-weight:700}
.nft-foot small{font-size:.85em;opacity:.8;font-weight:600}
.nft-tag{position:absolute;top:6%;left:6%;font-size:calc(var(--w)*.055);padding:.3em .7em;border-radius:99px;background:rgba(0,0,0,.35);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.nft::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);transform:translateX(-130%);mix-blend-mode:soft-light}
.rar-rare{box-shadow:inset 0 0 0 2px #60a5fa,0 0 26px #60a5fa77}
.rar-epic,.rar-legendary{box-shadow:inset 0 0 0 2px #c084fc,0 0 30px #c084fc88}.rar-legendary{box-shadow:inset 0 0 0 2px #fbbf24,0 0 36px #fbbf24aa}
.rar-epic::after,.rar-legendary::after{animation:shine 3.6s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(130%)}}
.mrow{display:flex;align-items:center;gap:14px;padding:11px 6px;border-radius:16px;cursor:pointer;transition:background .2s,transform .2s var(--spring)}
.mrow:hover{background:var(--field)}.mrow:active{transform:scale(.98)}
.mrow .mi{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none}
.mrow .mt{flex:1;font-weight:600;min-width:0}
.mrow .mv{color:var(--fg2);font-size:13px;white-space:nowrap}
.chev{color:var(--fg2);opacity:.6;flex:none}
.toggle{position:relative;width:46px;height:28px;border-radius:99px;background:var(--field);flex:none;transition:background .25s}
.toggle.on{background:linear-gradient(135deg,var(--acc1),var(--acc2))}
.toggle i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .25s var(--spring)}
.toggle.on i{transform:translateX(18px)}
.banner-edit{position:relative;cursor:pointer}
.banner-edit .cam{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.45)}

/* ---------- шторки ---------- */
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,0);transition:background .35s,backdrop-filter .35s;-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0)}
.ov.in{background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet{width:min(560px,100%);max-height:90dvh;max-height:90vh;display:flex;flex-direction:column;border-radius:30px 30px 0 0;transform:translateY(100%);transition:transform .5s var(--ease),opacity .3s;background:var(--panel);padding-bottom:env(safe-area-inset-bottom)}
.ov.in .sheet{transform:none}
.sheet-head{display:flex;align-items:center;padding:14px 12px 4px 20px;position:relative}
.sheet-title{flex:1;font-weight:700;font-size:17px}
.grab{position:absolute;left:50%;top:6px;width:38px;height:4px;margin-left:-19px;border-radius:9px;background:var(--fg2);opacity:.4}
.sheet-body{overflow-y:auto;padding:8px 20px 22px;overscroll-behavior:contain;display:flex;flex-direction:column;gap:14px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:30px;transform:translateY(28px) scale(.95);opacity:0}.ov.in .sheet{transform:none;opacity:1}}

.banner{height:110px;margin:-8px -20px 0;position:relative}
.pf-top{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:-56px;text-align:center}
.pf-top .av{border:4px solid rgba(255,255,255,.35)}
.pf-top h2{margin:6px 0 0;font-size:22px;letter-spacing:-.02em}
.pf-top .un{color:var(--fg2)}
.bio{text-align:center;white-space:pre-wrap}
.row-btns{display:flex;gap:10px}.row-btns .btn{flex:1}
.sec{font-weight:700;color:var(--fg2);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;justify-items:center}
.ggrid .nft{cursor:pointer;transition:transform .3s var(--spring)}.ggrid .nft:active{transform:scale(.94)}
.gcard{width:100%;padding:12px 8px;border-radius:22px;text-align:center;background:var(--field);box-shadow:inset 0 1px 0 rgba(255,255,255,.25);transition:transform .3s var(--spring),background .2s;display:flex;flex-direction:column;gap:2px;align-items:center}
.gcard:active{transform:scale(.93)}.gcard .e{font-size:40px;line-height:1.2;animation:float 4s ease-in-out infinite}
.gcard .p{font-weight:700;color:#ffc93c}.gcard small{color:var(--fg2);font-size:11.5px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:14px;background:var(--field)}.kv span:first-child{color:var(--fg2)}
.center{display:flex;justify-content:center}
.bigstar{text-align:center;font-size:56px;filter:drop-shadow(0 0 22px #ffc93c);animation:float 3.5s ease-in-out infinite}
.bal{text-align:center;font-size:34px;font-weight:800;letter-spacing:-.02em}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips .chip{cursor:pointer}
.sw{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.sw button{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 1px 0 rgba(255,255,255,.6);transition:transform .3s var(--spring),outline-color .2s;outline:3px solid transparent;outline-offset:2px}
.sw button.on{outline-color:var(--fg);transform:scale(1.12)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{aspect-ratio:1;border-radius:18px;background-size:cover;background-position:center;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);outline:3px solid transparent;outline-offset:2px;transition:transform .3s var(--spring),outline-color .2s;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.tile.on{outline-color:var(--fg);transform:scale(1.06)}
.tile.live{background:linear-gradient(135deg,#7c5cff,#00c2ff 50%,#ff4fa3)}
.tile.add{background:var(--field);color:var(--fg);text-shadow:none}
input[type=range]{width:100%;accent-color:var(--acc1)}
.lab{display:flex;justify-content:space-between;color:var(--fg2);font-size:13px;margin-bottom:4px}
.avedit{align-self:center;position:relative;cursor:pointer}
.avedit .cam{position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--acc1),var(--acc2));box-shadow:0 4px 12px var(--shadow)}
.lightbox{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(0,0,0,0);transition:background .3s;cursor:zoom-out}
.lightbox.in{background:rgba(0,0,0,.88)}
.lightbox img{max-width:96vw;max-height:92vh;border-radius:14px;transform:scale(.85);opacity:0;transition:transform .45s var(--ease),opacity .3s}
.lightbox.in img{transform:none;opacity:1}
.burst{position:fixed;z-index:80;pointer-events:none;font-size:28px;animation:burst 1.2s var(--ease) forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.4);opacity:0}}
#toasts{position:fixed;z-index:90;top:max(14px,env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{padding:10px 18px;border-radius:99px;max-width:90vw;font-weight:600;animation:toastIn .45s var(--spring) both;background:var(--panel);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 26px var(--shadow)}
.toast.err{color:var(--danger)}.toast.out{animation:toastOut .3s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(-20px) scale(.9)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-14px) scale(.95)}}
#net{position:fixed;z-index:60;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translate(-50%,120px);padding:8px 16px;border-radius:99px;display:flex;gap:8px;align-items:center;font-weight:600;transition:transform .45s var(--spring)}
#net.show{transform:translate(-50%,0)}

/* ---------- звонки ---------- */
.call-ov{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;align-items:center;color:#fff;overflow:hidden}
.call-bg{position:absolute;inset:-10%;background:linear-gradient(160deg,#241a4a,#0b0b1a 60%);filter:blur(30px)}
.call-av{margin-top:14vh;position:relative;z-index:1;animation:callPulse 2.4s ease-in-out infinite}
.call-av .av{box-shadow:0 0 0 0 rgba(255,255,255,.25)}
@keyframes callPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.call-name{z-index:1;margin-top:18px;font-size:24px;font-weight:700}
.call-status{z-index:1;margin-top:6px;color:rgba(255,255,255,.65)}
.call-btns{z-index:1;margin-top:auto;margin-bottom:8vh;display:flex;gap:26px;align-items:center;padding-bottom:env(safe-area-inset-bottom)}
.call-btns .icon-btn{width:66px;height:66px;transition:transform .25s var(--spring)}
.call-btns .icon-btn:active{transform:scale(.9)}
.call-accept{background:var(--ok);color:#06251a;animation:pulse 1.4s infinite}
.call-reject{background:var(--danger);color:#2a0006}
.call-mute{background:rgba(255,255,255,.18)}
.call-mute.on{background:#fff;color:#111}

/* ---------- дрифт для эксклюзивного подарка ---------- */
.nft.drift .nft-emoji{animation:driftCar 1.8s ease-in-out infinite}
@keyframes driftCar{0%,100%{transform:rotate(-8deg) translateX(-4%)}50%{transform:rotate(8deg) translateX(4%)}}
.nft.drift::before{content:"";position:absolute;left:8%;right:8%;bottom:20%;height:10px;border-radius:99px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.55) 0 10px,transparent 10px 20px);filter:blur(1px);animation:driftSmoke 1.8s ease-in-out infinite}
@keyframes driftSmoke{0%,100%{opacity:.2;transform:translateX(-6%)}50%{opacity:.55;transform:translateX(6%)}}

/* ---------- мобильная версия ---------- */
@media(max-width:820px){
  #main{padding:0;gap:0}
  #side{position:absolute;inset:0;width:auto;border-radius:0}
  #chat{position:absolute;inset:0;border-radius:0;transform:translateX(105%)}
  .chat-open #chat{transform:none}
  .chat-open #side{transform:translateX(-25%);opacity:.5}
  .back{display:inline-grid}
  .chat-head{top:max(8px,env(safe-area-inset-top))}
  #msgs{padding-top:calc(78px + env(safe-area-inset-top))}
  .composer{bottom:max(8px,env(safe-area-inset-bottom))}
  .emoji{bottom:calc(72px + env(safe-area-inset-bottom))}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ================= слои (кнопка «назад» на телефоне) ================= */
const layers = []; let skipPop = 0;
function pushLayer(close) { const l = { close }; layers.push(l); history.pushState({ z: 1 }, ''); return l; }
function dropLayer(l) { const i = layers.indexOf(l); if (i < 0) return; layers.splice(i, 1); skipPop++; history.back(); }
addEventListener('popstate', () => { if (skipPop > 0) { skipPop--; return; } const l = layers.pop(); if (l) l.close(true); });

/* ================= шторки ================= */
function sheet(title, build) {
  const body = h('div', { class: 'sheet-body' });
  const ov = h('div', { class: 'ov' });
  const api = { body, ov, close() { if (!layers.includes(layer)) return; doClose(); dropLayer(layer); } };
  const head = h('div', { class: 'sheet-head' }, h('i', { class: 'grab' }), h('div', { class: 'sheet-title' }, title), h('button', { class: 'icon-btn', onclick: () => api.close(), 'aria-label': 'Закрыть' }, ico('x')));
  ov.append(h('div', { class: 'sheet glass' }, head, body));
  document.body.append(ov);
  requestAnimationFrame(() => requestAnimationFrame(() => ov.classList.add('in')));
  const doClose = () => { ov.classList.remove('in'); setTimeout(() => ov.remove(), 400); };
  const layer = pushLayer(doClose);
  ov.addEventListener('click', e => { if (e.target === ov) api.close(); });
  build && build(body, api);
  return api;
}
function toggleEl(on, onchange) {
  const t = h('div', { class: 'toggle' + (on ? ' on' : ''), onclick: () => { on = !on; t.classList.toggle('on', on); onchange(on); } }, h('i'));
  return t;
}
function mrow(icon, bg, title, value, onclick) {
  return h('div', { class: 'mrow', onclick }, h('div', { class: 'mi', style: { background: bg } }, ico(icon, 19)), h('div', { class: 'mt' }, title), value ? h('div', { class: 'mv' }, value) : null, onclick ? h('span', { class: 'chev' }, ico('chev', 18)) : null);
}
function lightbox(src) {
  const img = h('img', { src, alt: '', draggable: 'false' });
  const lb = h('div', { class: 'lightbox' }, img);
  document.body.append(lb); requestAnimationFrame(() => lb.classList.add('in'));
  const doClose = () => { lb.classList.remove('in'); setTimeout(() => lb.remove(), 350); };
  const layer = pushLayer(doClose);
  let scale = 1, tx = 0, ty = 0, drag = null;
  const apply = () => { img.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; img.style.transition = drag ? 'none' : 'transform .25s var(--spring)'; img.style.cursor = scale > 1 ? 'grab' : 'zoom-out'; };
  const reset = () => { scale = 1; tx = 0; ty = 0; apply(); };
  img.addEventListener('dblclick', e => { e.stopPropagation(); if (scale === 1) { scale = 2.4; const r = img.getBoundingClientRect(); tx = (r.width / 2 - (e.clientX - r.left)) * (scale - 1) / scale; ty = (r.height / 2 - (e.clientY - r.top)) * (scale - 1) / scale; } else reset(); apply(); });
  img.addEventListener('click', e => e.stopPropagation());
  img.addEventListener('pointerdown', e => { if (scale === 1) return; drag = { x: e.clientX - tx, y: e.clientY - ty }; img.setPointerCapture(e.pointerId); });
  img.addEventListener('pointermove', e => { if (!drag) return; tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply(); });
  const endDrag = () => drag = null; img.addEventListener('pointerup', endDrag); img.addEventListener('pointercancel', endDrag);
  img.addEventListener('wheel', e => { e.preventDefault(); scale = Math.min(4, Math.max(1, scale - e.deltaY * .0015)); if (scale === 1) { tx = 0; ty = 0; } apply(); }, { passive: false });
  let pinch = null;
  const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  img.addEventListener('touchstart', e => { if (e.touches.length === 2) { pinch = { d: dist(e.touches[0], e.touches[1]), s: scale }; drag = null; } }, { passive: true });
  img.addEventListener('touchmove', e => { if (pinch && e.touches.length === 2) { e.preventDefault(); scale = Math.min(4, Math.max(1, pinch.s * dist(e.touches[0], e.touches[1]) / pinch.d)); if (scale === 1) { tx = 0; ty = 0; } apply(); } }, { passive: false });
  img.addEventListener('touchend', e => { if (e.touches.length < 2) pinch = null; });
  lb.onclick = () => { if (scale > 1) return reset(); if (layers.includes(layer)) { doClose(); dropLayer(layer); } };
}

/* ================= звонки (WebRTC, аудио) ================= */
const RTC_CFG = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
const Call = { pc: null, stream: null, peer: null, state: null, muted: false };
function callSet(el, hidden) { el.hidden = hidden; }
function showCall(user, status, mode) {
  $('#callOv').hidden = false;
  $('#callAv').replaceChildren(avatar({ ...user, online: false }, 120));
  $('#callName').textContent = user.name; $('#callStatus').textContent = status;
  callSet($('#callAccept'), mode !== 'incoming'); callSet($('#callReject'), mode === 'active'); callSet($('#callHangup'), mode !== 'active'); callSet($('#callMute'), mode !== 'active');
}
function hideCall() { $('#callOv').hidden = true; $('#callMute').classList.remove('on'); }
function endCallCleanup() {
  if (Call.pc) { try { Call.pc.close(); } catch {} Call.pc = null; }
  if (Call.stream) { Call.stream.getTracks().forEach(t => t.stop()); Call.stream = null; }
  Call.peer = null; Call.state = null; Call.muted = false; hideCall();
}
async function ensurePC(peerId) {
  Call.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const pc = new RTCPeerConnection(RTC_CFG);
  Call.stream.getTracks().forEach(t => pc.addTrack(t, Call.stream));
  pc.onicecandidate = e => { if (e.candidate) rpc('call:signal', { peer: peerId, data: { type: 'candidate', candidate: e.candidate } }).catch(() => {}); };
  pc.ontrack = e => { $('#remoteAudio').srcObject = e.streams[0]; };
  pc.onconnectionstatechange = () => { if (['failed', 'closed'].includes(pc.connectionState) && Call.state === 'active') endCall(true); };
  Call.pc = pc; return pc;
}
async function startCall(peerId) {
  if (!navigator.mediaDevices?.getUserMedia) return toast('Звонки не поддерживаются на этом устройстве', 'err');
  const user = S.users.get(peerId); if (!user) return;
  Call.peer = peerId; Call.state = 'calling'; showCall(user, 'Вызов…', 'calling');
  try { await rpc('call:invite', { peer: peerId }); } catch (e) { toast(e.message, 'err'); endCallCleanup(); }
}
async function acceptCall() {
  const peerId = Call.peer; const user = S.users.get(peerId); Call.state = 'connecting'; showCall(user, 'Соединение…', 'connecting');
  try { await ensurePC(peerId); await rpc('call:accept', { peer: peerId }); } catch (e) { toast(e.message || 'Нет доступа к микрофону', 'err'); endCall(true); }
}
function rejectCall() { const p = Call.peer; endCallCleanup(); if (p) rpc('call:cancel', { peer: p }).catch(() => {}); }
function endCall(silent) { const p = Call.peer; endCallCleanup(); if (p && !silent) rpc('call:end', { peer: p }).catch(() => {}); }
$('#callBtn').onclick = () => S.cur && startCall(S.cur);
$('#callAccept').onclick = acceptCall;
$('#callReject').onclick = rejectCall;
$('#callHangup').onclick = () => endCall(false);
$('#callMute').onclick = () => { if (!Call.stream) return; Call.muted = !Call.muted; Call.stream.getAudioTracks().forEach(t => t.enabled = !Call.muted); $('#callMute').classList.toggle('on', Call.muted); $('#callMute').replaceChildren(ico(Call.muted ? 'micOff' : 'mic', 24)); };
function wireCallSocket(s) {
  s.on('call:incoming', ({ user }) => { if (Call.state) { rpc('call:reject', { peer: user.id }).catch(() => {}); return; } S.users.set(user.id, user); Call.peer = user.id; Call.state = 'incoming'; showCall(user, 'Входящий звонок', 'incoming'); });
  s.on('call:accepted', async ({ from }) => {
    if (Call.peer !== from || Call.state !== 'calling') return; Call.state = 'connecting'; showCall(S.users.get(from), 'Соединение…', 'connecting');
    try { const pc = await ensurePC(from); const offer = await pc.createOffer(); await pc.setLocalDescription(offer); await rpc('call:signal', { peer: from, data: { type: 'offer', sdp: offer } }); }
    catch (e) { toast(e.message || 'Нет доступа к микрофону', 'err'); endCall(true); }
  });
  s.on('call:signal', async ({ from, data }) => {
    if (Call.peer !== from) return;
    try {
      if (data.type === 'offer') { await Call.pc.setRemoteDescription(data.sdp); const ans = await Call.pc.createAnswer(); await Call.pc.setLocalDescription(ans); await rpc('call:signal', { peer: from, data: { type: 'answer', sdp: ans } }); Call.state = 'active'; showCall(S.users.get(from), '00:00', 'active'); startCallTimer(); }
      else if (data.type === 'answer') { await Call.pc.setRemoteDescription(data.sdp); Call.state = 'active'; showCall(S.users.get(from), '00:00', 'active'); startCallTimer(); }
      else if (data.type === 'candidate' && Call.pc) { try { await Call.pc.addIceCandidate(data.candidate); } catch {} }
    } catch (e) { console.error(e); endCall(true); }
  });
  s.on('call:cancelled', ({ from }) => { if (Call.peer === from) { toast('Звонок отменён'); endCallCleanup(); } });
  s.on('call:rejected', ({ from }) => { if (Call.peer === from) { toast('Звонок отклонён'); endCallCleanup(); } });
  s.on('call:ended', ({ from }) => { if (Call.peer === from) { toast('Звонок завершён'); endCallCleanup(); } });
}
let callTimer;
function startCallTimer() { const t0 = Date.now(); clearInterval(callTimer); callTimer = setInterval(() => { if (Call.state !== 'active') return clearInterval(callTimer); $('#callStatus').textContent = fmtDur((Date.now() - t0) / 1000); }, 1000); }

/* ================= подключение ================= */
function startApp() {
  $('#auth').hidden = true; $('#main').hidden = false;
  if (S.sock) S.sock.disconnect();
  const s = S.sock = io({ auth: { token: S.token } });
  s.on('connect', boot);
  s.on('disconnect', () => { $('#net').classList.add('show'); if (Call.state) endCallCleanup(); });
  wireCallSocket(s);
  s.on('connect_error', e => { if (e.message === 'auth') { localStorage.removeItem('zg_token'); s.disconnect(); showAuth(); } else $('#net').classList.add('show'); });
  s.on('msg', onMsg);
  s.on('me', me => { S.me = me; applyAccent(); renderMe(); refreshSheetsBalance(); });
  s.on('presence', p => { const u = S.users.get(p.id); if (u) { Object.assign(u, p); } const c = S.chats.get(p.id); if (c) Object.assign(c.user, p); renderList(); if (S.cur === p.id) renderHead(); });
  s.on('user_update', u => { S.users.set(u.id, u); const c = S.chats.get(u.id); if (c) c.user = u; renderList(); if (S.cur === u.id) renderHead(); });
  s.on('typing', ({ from }) => { clearTimeout(S.typing.get(from)); S.typing.set(from, setTimeout(() => { S.typing.delete(from); renderList(); if (S.cur === from) renderHead(); }, 3200)); renderList(); if (S.cur === from) renderHead(); });
  s.on('delivered', ({ by }) => bumpStatus(by, 1));
  s.on('read', ({ by }) => bumpStatus(by, 2));
  s.on('read_self', ({ peer }) => { const c = S.chats.get(peer); if (c) { c.unread = 0; renderList(); } });
  s.on('toast', ({ text }) => toast(text));
}
function showAuth() { $('#main').hidden = true; $('#auth').hidden = false; $('#net').classList.remove('show'); }
async function boot() {
  try {
    const r = await rpc('bootstrap');
    $('#net').classList.remove('show');
    S.me = r.me; S.gifts = r.gifts; S.daily = r.daily; S.chats.clear();
    for (const c of r.chats) { S.users.set(c.user.id, c.user); S.chats.set(c.user.id, c); }
    applyAccent(); renderMe(); renderList();
    if (S.cur) { await loadHistory(S.cur); renderMsgs(); if (document.visibilityState === 'visible') markRead(S.cur); }
  } catch (e) { toast(e.message, 'err'); }
}
function renderMe() {
  const b = $('#meBtn'); b.replaceChildren(avatar({ ...S.me, online: false }, 38)); $('#starsN').textContent = S.me.stars;
}

/* ---------- свои темы (цвет интерфейса, хранится локально) ---------- */
function customTheme() { try { const t = JSON.parse(localStorage.zg_theme_c || 'null'); return t ? [t.c1, t.c2] : null; } catch { return null; } }
function themeList() { try { return JSON.parse(localStorage.zg_themes || '[]'); } catch { return []; } }
function setCustomTheme(t) { if (t) localStorage.zg_theme_c = JSON.stringify(t); else localStorage.removeItem('zg_theme_c'); applyAccent(); }

function openSettings() {
  sheet('Настройки', (body, api) => {
    let taps = 0, tapTimer;
    const ver = h('div', { class: 'hint', style: { cursor: 'pointer', userSelect: 'none', paddingTop: '20px' }, onclick: () => {
      clearTimeout(tapTimer); tapTimer = setTimeout(() => taps = 0, 1800);
      if (++taps >= 5) { taps = 0; api.close(); setTimeout(openAdminLogin, 250); }
    } }, 'ZadrottzGram v2.0');
    RC(body,
      mrow('user', 'linear-gradient(135deg,#7c5cff,#00d1ff)', 'Мой профиль', S.me.name, () => { api.close(); setTimeout(openEdit, 250); }),
      mrow('lock', 'linear-gradient(135deg,#22c55e,#0ea5e9)', 'Конфиденциальность', null, () => { api.close(); setTimeout(openPrivacy, 250); }),
      mrow('wall', 'linear-gradient(135deg,#f97316,#facc15)', 'Настройки чата', null, () => { api.close(); setTimeout(openChatSettings, 250); }),
      mrow('db', 'linear-gradient(135deg,#64748b,#94a3b8)', 'Данные и память', null, () => { api.close(); setTimeout(openDataStorage, 250); }),

  });
}
function openPrivacy() {
  sheet('Конфиденциальность', body => {
    const row = h('div', { class: 'mrow', style: { cursor: 'default' } }, h('div', { class: 'mi', style: { background: 'linear-gradient(135deg,#22c55e,#0ea5e9)' } }, ico('bell', 19)), h('div', { class: 'mt' }, 'Показывать «в сети» и время захода'));
    const tg = toggleEl(!S.me.hideOnline, async on => { try { await rpc('profile:set', { hideOnline: !on }); } catch (e) { toast(e.message, 'err'); tg.classList.toggle('on', !on); } });
    row.append(tg);
    body.append(row, h('div', { style: { color: 'var(--fg2)', fontSize: '12.5px' } }, 'Если выключено, собеседники видят только последнее сообщение — без статуса «в сети» и времени захода.'));
  });
}
function openChatSettings() {
  sheet('Настройки чата', (body, api) => {
    const theme = document.documentElement.dataset.theme;
    const seg = h('div', { class: 'seg' }, h('button', { class: theme === 'dark' ? 'on' : '' }, 'Тёмная'), h('button', { class: theme === 'light' ? 'on' : '' }, 'Светлая'), h('i'));
    seg.lastChild.style.transform = `translateX(${theme === 'light' ? 100 : 0}%)`;
    seg.onclick = e => { const b = e.target.closest('button'); if (!b) return; const i = [...seg.children].indexOf(b); if (i > 1) return; setTheme(i ? 'light' : 'dark'); [...seg.children].slice(0, 2).forEach((x, j) => x.classList.toggle('on', i === j)); seg.lastChild.style.transform = `translateX(${i * 100}%)`; };
    const tiles = h('div', { class: 'tiles' });
    const file = h('input', { type: 'file', accept: 'image/*', hidden: true });
    const dim = h('input', { type: 'range', min: 0, max: 75, value: loadWall().dim || 0 }), blur = h('input', { type: 'range', min: 0, max: 20, value: loadWall().blur || 0 });
    const cur = () => loadWall();
    const drawTiles = () => {
      const c = cur(); RC(tiles,
        h('div', { class: 'tile live' + (c.t === 'live' ? ' on' : ''), onclick: () => { saveWall({ ...cur(), t: 'live' }); drawTiles(); } }, 'Живые'),
        ...WALLS.map((g, i) => h('div', { class: 'tile' + (c.t === 'preset' && c.v === i ? ' on' : ''), style: { backgroundImage: g }, onclick: () => { saveWall({ ...cur(), t: 'preset', v: i }); drawTiles(); } })),
        localStorage.zg_wallimg ? h('div', { class: 'tile' + (c.t === 'img' ? ' on' : ''), style: { backgroundImage: `url("${localStorage.zg_wallimg}")` }, onclick: () => { saveWall({ ...cur(), t: 'img' }); drawTiles(); } }) : null,
        h('div', { class: 'tile add', onclick: () => file.click() }, ico('plus', 26)));
    };
    file.onchange = async () => {
      const f = file.files[0]; if (!f) return;
      try { const d = await blobToDataURL(await imgToBlob(f, 1600, .8)); localStorage.zg_wallimg = d; saveWall({ ...cur(), t: 'img' }); drawTiles(); } catch (e) { toast(e.name === 'QuotaExceededError' ? 'Фото слишком большое для хранения' : e.message, 'err'); }
    };
    dim.oninput = () => saveWall({ ...cur(), dim: +dim.value }); blur.oninput = () => saveWall({ ...cur(), blur: +blur.value });
    drawTiles();

    const fs0 = +(localStorage.zg_fontsize || 15);
    const fsize = h('input', { type: 'range', min: 13, max: 20, value: fs0 });
    fsize.oninput = () => { localStorage.zg_fontsize = fsize.value; document.body.style.fontSize = fsize.value + 'px'; };

    const themes = h('div', { class: 'sw' });
    const drawThemes = () => {
      const cust = customTheme(), list = themeList();
      themes.replaceChildren(...ACC.map((a, i) => h('button', { type: 'button', class: !cust && i === S.me.accent ? 'on' : '', style: { background: `linear-gradient(135deg,${a[0]},${a[1]})` }, onclick: async () => { setCustomTheme(null); try { await rpc('profile:set', { accent: i }); } catch {} drawThemes(); } })),
        ...list.map((t, i) => h('button', { type: 'button', class: cust && cust[0] === t.c1 ? 'on' : '', style: { background: `linear-gradient(135deg,${t.c1},${t.c2})` }, onclick: () => { setCustomTheme(t); drawThemes(); } })),
        h('button', { type: 'button', class: 'chip', style: { width: 'auto', height: '38px', borderRadius: '99px', padding: '0 14px' }, onclick: () => openThemeCreator(drawThemes) }, ico('plus', 16)));
    };
    drawThemes();

    body.replaceChildren(h('div', { class: 'sec' }, 'Тема оформления'), seg, h('div', { class: 'sec' }, 'Цветовая тема'), themes,
      h('div', { class: 'sec' }, 'Обои чата'), tiles, file,
      h('div', null, h('div', { class: 'lab' }, h('span', null, 'Затемнение')), dim), h('div', null, h('div', { class: 'lab' }, h('span', null, 'Размытие')), blur),
      h('div', { class: 'sec' }, 'Размер шрифта'), fsize,
      h('div', { style: { color: 'var(--fg2)', fontSize: '12.5px' } }, 'Обои и шрифт хранятся только на этом устройстве.'));
  });
}
function openThemeCreator(onSaved) {
  sheet('Своя тема', (body, api) => {
    const c1 = h('input', { type: 'color', value: '#7c5cff' }), c2 = h('input', { type: 'color', value: '#00d1ff' }), name = h('input', { placeholder: 'Название темы', maxlength: 20 });
    const prevw = h('div', { style: { height: '70px', borderRadius: '20px' } });
    const upd = () => prevw.style.background = `linear-gradient(135deg,${c1.value},${c2.value})`; upd();
    c1.oninput = upd; c2.oninput = upd;
    const save = h('button', { class: 'btn primary' }, 'Сохранить и применить');
    save.onclick = () => {
      const list = themeList(); const t = { name: name.value.trim() || 'Тема', c1: c1.value, c2: c2.value };
      list.push(t); try { localStorage.zg_themes = JSON.stringify(list); } catch { return toast('Не удалось сохранить тему', 'err'); }
      setCustomTheme(t); toast('Тема сохранена'); api.close(); onSaved && onSaved();
    };
    body.append(prevw, h('label', { class: 'field' }, name), h('div', { class: 'row-btns' }, h('label', { class: 'field', style: { justifyContent: 'center' } }, c1), h('label', { class: 'field', style: { justifyContent: 'center' } }, c2)), save);
  });
}
function openDataStorage() {
  sheet('Данные и память', body => {
    const wallSize = localStorage.zg_wallimg ? (localStorage.zg_wallimg.length / 1350).toFixed(0) + ' КБ' : '—';
    body.append(
      mrow('wall', 'linear-gradient(135deg,#f97316,#facc15)', 'Своё фоновое изображение', wallSize, null),
      h('button', { class: 'btn', onclick: () => { localStorage.removeItem('zg_wallimg'); saveWall({ t: 'live' }); toast('Обои очищены'); } }, 'Очистить обои'),
      h('button', { class: 'btn', onclick: () => { localStorage.removeItem('zg_themes'); localStorage.removeItem('zg_theme_c'); applyAccent(); toast('Свои темы удалены'); } }, 'Удалить свои темы'),
      h('div', { style: { color: 'var(--fg2)', fontSize: '12.5px' } }, 'Сообщения и подарки хранятся на сервере. Обои, шрифт и свои темы — только на этом устройстве.'));
  });
}

/* ---------- скрытая владельческая панель ---------- */
function openAdminLogin() {
  sheet('Владелец', (body, api) => {
    const pass = h('input', { type: 'password', placeholder: 'Пароль' });
    const err = h('div', { class: 'err' });
    const go = h('button', { class: 'btn primary' }, 'Войти');
    go.onclick = async () => { go.disabled = true; try { await rpc('admin:auth', { password: pass.value }); api.close(); setTimeout(openAdminPanel, 250); } catch (e) { err.textContent = e.message; go.disabled = false; } };
    body.append(h('label', { class: 'field' }, pass), err, go);
  });
}
function openAdminPanel() {
  sheet('Панель владельца', (body, api) => {
    const q = h('input', { placeholder: 'Поиск по @username' });
    const list = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px' } });
    const load = async () => {
      list.replaceChildren(h('div', { class: 'hint' }, h('span', { class: 'spin' })));
      try { const r = await rpc('admin:users', { q: q.value }); RC(list, ...r.users.map(u => {
        const amt = h('input', { type: 'number', placeholder: '±звёзды', style: { width: '110px' } });
        const btn = h('button', { class: 'btn', style: { height: '36px', padding: '0 14px' } }, 'Выдать');
        btn.onclick = async () => { const n = Math.trunc(+amt.value); if (!n) return; btn.disabled = true; try { const r2 = await rpc('admin:grant', { username: u.username, amount: n }); toast(`@${u.username}: ⭐ ${r2.stars}`); amt.value = ''; load(); } catch (e) { toast(e.message, 'err'); } btn.disabled = false; };
        return h('div', { class: 'kv' }, h('span', null, `@${u.username} (${u.name})`), h('div', { style: { display: 'flex', gap: '6px', alignItems: 'center' } }, h('b', null, '⭐ ' + u.stars), amt, btn));
      })); } catch (e) { list.replaceChildren(h('div', { class: 'hint' }, e.message)); }
    };
    let t; q.oninput = () => { clearTimeout(t); t = setTimeout(load, 250); };
    body.append(h('label', { class: 'field' }, q), list); load();
  });
}

/* ================= подарки и звёзды ================= */
const balNodes = new Set();
function refreshSheetsBalance() { for (const n of balNodes) { if (!n.isConnected) balNodes.delete(n); else n.textContent = S.me.stars; } $('#starsN').textContent = S.me.stars; }
function openGifts(peerId, tab = 0) {
  const peer = peerId && S.users.get(peerId);
  sheet(tab === 1 ? 'Звёзды' : 'Подарки', (body, api) => {
    let view = tab;
    const seg = h('div', { class: 'seg' }, h('button', { class: tab === 0 ? 'on' : '' }, 'Подарки'), h('button', { class: tab === 1 ? 'on' : '' }, 'Звёзды'), h('i'));
    seg.lastChild.style.transform = `translateX(${tab * 100}%)`;
    const area = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '14px' } });
    seg.onclick = e => { const b = e.target.closest('button'); if (!b) return; view = [...seg.children].indexOf(b); if (view > 1) return; [...seg.children].slice(0, 2).forEach((x, i) => x.classList.toggle('on', i === view)); seg.lastChild.style.transform = `translateX(${view * 100}%)`; draw(); };
    const bal = () => { const n = h('b', { class: 'bal-n' }, S.me.stars); balNodes.add(n); return h('span', { class: 'chip' }, h('span', { class: 'star ico fill' }, ico('star', 16, 'fill')), n); };
    function drawGifts() {
      if (!peer) { area.replaceChildren(h('div', { class: 'hint' }, 'Откройте чат с человеком, чтобы подарить ему подарок.')); return; }
      area.replaceChildren(h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } }, h('span', { style: { color: 'var(--fg2)' } }, 'Кому: ', h('b', { style: { color: 'var(--fg)' } }, peer.name)), bal()),
        h('div', { class: 'ggrid' }, S.gifts.map((g, i) => {
          const left = g.supply ? g.supply - g.minted : null, out = left === 0;
          return h('button', { class: 'gcard', style: { opacity: out ? .45 : 1 }, disabled: out, onclick: () => confirmGift(g) }, h('div', { class: 'e' }, g.emoji), h('div', null, g.name), h('div', { class: 'p' }, '⭐ ' + g.price), h('small', null, left == null ? 'без лимита' : out ? 'закончился' : `осталось ${left}`));
        })));
    }
    function confirmGift(g) {
      const note = h('input', { placeholder: 'Подпись к подарку (необязательно)', maxlength: 100 }), btn = h('button', { class: 'btn primary' }, `Подарить за ⭐ ${g.price}`);
      const enough = S.me.stars >= g.price; if (!enough) { btn.disabled = true; btn.textContent = `Не хватает ⭐ ${g.price - S.me.stars}`; }
      btn.onclick = async () => {
        btn.disabled = true;
        try { const r = await rpc('gift:send', { peer: peer.id, gid: g.id, note: note.value }); const rc = btn.getBoundingClientRect(); burst(g.emoji, rc.left + rc.width / 2, rc.top); toast('Подарок отправлен 🎁'); api.close(); }
        catch (e) { toast(e.message, 'err'); btn.disabled = false; }
      };
      const prevItem = { id: 'preview' + g.id, gid: g.id, name: g.name, emoji: g.emoji, num: g.minted + 1, sup: g.supply, bg: BACKS.length ? [2, 1, 7, 0, 4, 3, 5, 6][S.gifts.indexOf(g) % 8] : 0, sym: S.gifts.indexOf(g) % 6, rar: 'common' };
      area.replaceChildren(h('button', { class: 'btn', style: { alignSelf: 'flex-start', height: '36px' }, onclick: drawGifts }, ico('back', 16), 'Назад'),
        h('div', { class: 'center' }, nft(prevItem, 190)),
        h('div', { style: { textAlign: 'center', color: 'var(--fg2)', fontSize: '13px' } }, 'Уникальный фон, узор и редкость выпадут при отправке.', g.supply ? ` Выпуск: ${g.minted}/${g.supply}.` : ''),
        h('label', { class: 'field' }, note), h('div', { class: 'center' }, bal()), btn);
    }
    function drawStars() {
      const wait = 864e5 - (Date.now() - (S.me.lastDaily || 0)), can = wait <= 0;
      const daily = h('button', { class: 'btn primary' }, can ? `Забрать бонус +${S.daily} ⭐` : `Следующий бонус через ${Math.floor(wait / 36e5)} ч ${Math.floor(wait % 36e5 / 6e4)} мин`); daily.disabled = !can;
      daily.onclick = async () => { daily.disabled = true; try { await rpc('stars:daily'); burst('⭐'); toast(`+${S.daily} ⭐`); drawStars(); } catch (e) { toast(e.message, 'err'); } };
      const nodes = [h('div', { class: 'bigstar' }, '⭐'), h('div', { class: 'bal' }, (() => { const n = h('span', { class: 'bal-n' }, S.me.stars); balNodes.add(n); return n; })()),
        h('div', { style: { textAlign: 'center', color: 'var(--fg2)', fontSize: '13px' } }, 'Звёзды — валюта ZadrottzGram. Ими можно дарить NFT-подарки и переводить друзьям.'), daily];
      if (peer) {
        const amt = h('input', { type: 'number', min: 1, inputmode: 'numeric', placeholder: 'Сколько звёзд', style: { textAlign: 'center' } });
        const chips = h('div', { class: 'chips', style: { justifyContent: 'center' } }, [10, 50, 100, 500].map(n => h('button', { class: 'chip', onclick: () => { amt.value = n; } }, '⭐ ' + n)));
        const send = h('button', { class: 'btn' }, `Отправить ${peer.name}`);
        send.onclick = async () => { const n = +amt.value; if (!(n >= 1)) return toast('Укажите сумму', 'err'); send.disabled = true; try { await rpc('stars:send', { peer: peer.id, amount: n }); burst('⭐'); toast(`Отправлено ⭐ ${n}`); api.close(); } catch (e) { toast(e.message, 'err'); send.disabled = false; } };
        nodes.push(h('div', { class: 'sec' }, 'Перевод'), chips, h('label', { class: 'field' }, amt), send);
      }
      area.replaceChildren(...nodes);
    }
    const draw = () => view === 0 ? drawGifts() : drawStars();
    body.append(seg, area); draw();
  });
}
